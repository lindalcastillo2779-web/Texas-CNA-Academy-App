services:
  - type: web
    name: texas-cna-academy
    runtime: python
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: >
      python -m uvicorn app_server:app
      --host 0.0.0.0
      --port $PORT
      --proxy-headers
    envVars:
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
    disk:
      name: cna-data
      mountPath: /data
      sizeGB: 1
