services:
  - type: web
    name: texas-cna-academy-app
    env: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true

    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      if [ -f package.json ]; then npm ci && npm run build; fi

    startCommand: |
      python -m uvicorn app_server:app --host 0.0.0.0 --port $PORT --proxy-headers

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"

      - key: STREAMLIT_INTERNAL_PORT
        value: "8501"

      - key: ADMIN_SECRET
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        sync: false

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: SMTP_FROM
        sync: false

      - key: APP_BASE_URL
        value: https://texascnaacademyapp.com

    disk:
      name: texas-cna-academy-data
      mountPath: /data
      sizeGB: 1
